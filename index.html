<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Humus Coast - Food Waste Collection</title>
    <style>
        :root {
            --brand-main: #2E7D32;
            --brand-dark: #1B5E20;
            --brand-light: #e8f5e9;
            --brand-accent: #fdd835;
            --text-dark: #2c3e50;
            --text-light: #607d8b;
            --bg-offwhite: #fcfcfc;
        }
        
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; 
            padding: 0;
            color: var(--text-dark);
            background-color: var(--bg-offwhite);
            line-height: 1.6;
        }

        /* Modern Sticky Header */
        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 5%;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--brand-main); letter-spacing: -0.5px; }
        nav a { text-decoration: none; color: var(--text-dark); margin-left: 2rem; font-weight: 600; transition: color 0.3s; }
        nav a:hover { color: var(--brand-main); }

        /* Powerful Hero Section */
        .hero {
            background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-main) 100%);
            color: white;
            text-align: center;
            padding: 10rem 2rem 8rem 2rem;
            position: relative;
            overflow: hidden;
        }
        .hero::after {
            content: ''; position: absolute; bottom: -50px; left: -10%; width: 120%; height: 100px;
            background: var(--bg-offwhite);
            transform: rotate(-3deg);
        }
        .hero h1 { font-size: 4rem; font-weight: 900; margin: 0 0 1.5rem 0; line-height: 1.1; letter-spacing: -1px; }
        .hero p { font-size: 1.4rem; max-width: 700px; margin: 0 auto 3rem auto; opacity: 0.9; }
        
        /* Buttons */
        .btn {
            display: inline-block;
            padding: 1rem 2.5rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            background: var(--brand-main);
            color: white;
            box-shadow: 0 10px 20px rgba(46,125,50,0.2);
            border: none;
            cursor: pointer;
        }
        .hero .btn { background: white; color: var(--brand-dark); }
        .hero .btn:hover { background: var(--brand-accent); transform: translateY(-5px); box-shadow: 0 15px 25px rgba(0,0,0,0.2); }
        .btn:hover { background: var(--brand-dark); transform: translateY(-3px); box-shadow: 0 10px 25px rgba(46,125,50,0.3); }
